<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawnki</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf8;
    --line: #ddd;
    --accent: #2f6fed;
    --error: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }

  p.subtitle {
    color: #666;
    font-size: 14px;
    margin: 0 0 28px;
  }

  input#codeInput {
    width: 100%;
    font-size: 22px;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    padding: 14px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  input#codeInput:focus {
    outline: none;
    border-color: var(--accent);
  }

  button#confirmBtn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  button#confirmBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .message {
    margin-top: 16px;
    font-size: 14px;
    min-height: 20px;
  }

  .message.error { color: var(--error); }
  .message.success { color: #22a35f; }
</style>
</head>
<body>
<div class="card">
  <h1>Pair Your Deck</h1>
  <p class="subtitle">Enter the code shown in Anki to connect it to this device.</p>

  <input id="codeInput" type="text" placeholder="ANKI-XXXX-XXXX" maxlength="14" autocomplete="off" autocapitalize="characters">
  <button id="confirmBtn">Pair Deck</button>
  <div id="message" class="message"></div>
</div>

<script>
const input = document.getElementById('codeInput');
const btn = document.getElementById('confirmBtn');
const msg = document.getElementById('message');

function formatPairingCode(raw) {
  // Strip everything except letters/digits, uppercase it
  const clean = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');

  // Drop a leading "ANKI" if the user typed it themselves - we add it back below
  const withoutPrefix = clean.startsWith('ANKI') ? clean.slice(4) : clean;

  // Take up to 8 remaining chars and split into two blocks of 4
  const chars = withoutPrefix.slice(0, 8);
  const block1 = chars.slice(0, 4);
  const block2 = chars.slice(4, 8);

  let formatted = 'ANKI';
  if (block1) formatted += '-' + block1;
  if (block2) formatted += '-' + block2;

  return formatted;
}

input.addEventListener('input', () => {
  const cursorWasAtEnd = input.selectionStart === input.value.length;
  input.value = formatPairingCode(input.value);
  if (cursorWasAtEnd) {
    input.setSelectionRange(input.value.length, input.value.length);
  }
});

input.addEventListener('focus', () => {
  if (!input.value) {
    input.value = 'ANKI-';
    input.setSelectionRange(input.value.length, input.value.length);
  }
});

btn.addEventListener('click', submitCode);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitCode();
});

async function submitCode() {
  const code = input.value.trim();
  if (!code) {
    showMessage('Enter a code first.', 'error');
    return;
  }

  btn.disabled = true;
  showMessage('Pairing...', '');

  try {
    const resp = await fetch('/api/pair/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pairing_code: code })
    });

    const data = await resp.json();

    if (!resp.ok) {
      showMessage(data.error || 'That code is invalid or already used.', 'error');
      btn.disabled = false;
      return;
    }

    showMessage('Paired! Taking you to the drawing canvas...', 'success');

    // Fetch the device token via status, then redirect into /draw with it
    const statusResp = await fetch(`/api/pair/status?pairing_id=${data.pairing_id}`);
    const statusData = await statusResp.json();

    setTimeout(() => {
      window.location.href = `/draw?token=${encodeURIComponent(statusData.device_token)}`;
    }, 800);

  } catch (err) {
    showMessage('Something went wrong. Try again.', 'error');
    btn.disabled = false;
  }
}

function showMessage(text, type) {
  msg.textContent = text;
  msg.className = 'message' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
