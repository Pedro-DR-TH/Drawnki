<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drawnki</title>
<link rel="stylesheet" href="https://esm.sh/tldraw@3.0.0/tldraw.css">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf8;
    --line: #ddd;
    --accent: #2f6fed;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
    background: var(--paper);
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .side-toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .side-toggle button {
    border: none;
    background: transparent;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }

  .side-toggle button.active {
    background: var(--accent);
    color: white;
  }

  .save-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .editor-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  .editor-instance {
    position: absolute;
    inset: 0;
  }

  .editor-instance.hidden {
    display: none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>New Card</h1>
    <div class="side-toggle">
      <button id="frontBtn" class="active">Front</button>
      <button id="backBtn">Back</button>
    </div>
    <button id="saveBtn" class="save-btn">Save Card</button>
  </header>

  <div class="editor-wrap">
    <div id="frontEditor" class="editor-instance"></div>
    <div id="backEditor" class="editor-instance hidden"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0?target=esnext",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?target=esnext&deps=react@18.2.0",
    "tldraw": "https://esm.sh/tldraw@3.0.0?target=esnext&deps=react@18.2.0,react-dom@18.2.0"
  }
}
</script>

<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { Tldraw } from "tldraw";

let frontEditor = null;
let backEditor = null;

function mountEditor(containerId, onMount) {
  const root = createRoot(document.getElementById(containerId));
  root.render(
    React.createElement(Tldraw, { onMount })
  );
}

mountEditor('frontEditor', (editor) => { frontEditor = editor; });
mountEditor('backEditor', (editor) => { backEditor = editor; });

let currentSide = 'front';

document.getElementById('frontBtn').addEventListener('click', () => switchSide('front'));
document.getElementById('backBtn').addEventListener('click', () => switchSide('back'));

function switchSide(side) {
  currentSide = side;
  document.getElementById('frontBtn').classList.toggle('active', side === 'front');
  document.getElementById('backBtn').classList.toggle('active', side === 'back');
  document.getElementById('frontEditor').classList.toggle('hidden', side !== 'front');
  document.getElementById('backEditor').classList.toggle('hidden', side !== 'back');
}

async function exportEditorToDataURL(editor) {
  if (!editor) return null;
  const shapeIds = editor.getCurrentPageShapeIds();
  if (shapeIds.size === 0) {
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/png');
  }

  const { blob } = await editor.toImage([...shapeIds], {
    format: 'png',
    background: true,
    padding: 16
  });

  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function clearEditor(editor) {
  if (!editor) return;
  const shapeIds = editor.getCurrentPageShapeIds();
  if (shapeIds.size > 0) {
    editor.deleteShapes([...shapeIds]);
  }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  let frontData, backData;

  try {
    frontData = await exportEditorToDataURL(frontEditor);
    backData = await exportEditorToDataURL(backEditor);
  } catch (err) {
    alert('Could not export drawing: ' + err.message);
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const deviceToken = params.get('token');

  try {
    const resp = await fetch('/api/cards/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        device_token: deviceToken,
        front_image: frontData,
        back_image: backData
      })
    });
    if (!resp.ok) throw new Error('Save failed');

    alert('Card saved! Starting a new card.');
    clearEditor(frontEditor);
    clearEditor(backEditor);
    switchSide('front');
  } catch (err) {
    alert('Could not save card: ' + err.message);
  }
});
</script>
</body>
</html>
